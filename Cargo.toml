[package]
name = "pet"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = "0.12.0"
dirs = "6.0.0"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
