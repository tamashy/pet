[package]
name = "pet"
version = "0.1.13"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.0"
crossterm = "0.29.0"
dialoguer = "0.12.0"
dirs = "6.0.0"
fuzzy-matcher = "0.3.7"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
